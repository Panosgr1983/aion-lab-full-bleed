<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEETH — Ορθοδοντικό Ιατρείο — Ορθοδοντικό ιατρείο — Ιατρικές υπηρεσίες</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;500;800&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--ink:#060E24;--paper:#E5E7EB;--accent:#7FA6FF}
body{background:var(--ink);color:var(--paper);font-family:Archivo,sans-serif;overflow-x:hidden}
.full{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;position:relative}
.bg{position:absolute;inset:0;z-index:0}
.bg img{width:100%;height:100%;object-fit:cover;filter:grayscale(.6) brightness(.35)}
.bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 70%,transparent),var(--ink))}
.nav{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:26px clamp(24px,5vw,60px);border-bottom:1px solid rgba(255,255,255,.12)}
.logo{font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.nav a{color:var(--paper);text-decoration:none;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.mega{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:clamp(30px,6vw,80px) clamp(24px,5vw,60px)}
.mega h1{font-size:clamp(3.5rem,13vw,13rem);line-height:.82;letter-spacing:-.05em;font-weight:800;text-transform:uppercase}
.mega h1 .out{-webkit-text-stroke:1.5px var(--accent);color:transparent;font-style:italic}
.mega-bottom{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;padding:0 clamp(24px,5vw,60px) clamp(30px,5vw,60px);font-family:'Space Mono';font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
@media(max-width:700px){.mega-bottom{grid-template-columns:1fr}}
</style></head><body>
<div class="full">
  <div class="bg"><img src="img/dental-1.jpg" alt=""></div>
  <header class="nav"><div class="logo">TEETH — Ορθοδοντικό Ιατρείο<span>.</span></div><a href="#ep">Ραντεβού →</a></header>
  <div class="mega">
    <h1>TEETH<br><span class="out">Ορθοδοντικό</span></h1>
  </div>
  <div class="mega-bottom"><span>Γαλάτσι</span><span>2102910435</span><span>Επικοινωνία</span></div>
</div>
</body></html>
